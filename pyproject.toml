[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpat"
version = "0.1.0"
description = "CPAT — Multi-Asset Algorithmic Trading System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CPAT Team" }]
keywords = ["quantitative finance", "algorithmic trading", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "rich>=13.7",
    "scipy>=1.13",
    "click>=8.1",
    "streamlit>=1.44",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "freezegun>=1.5",
]

[project.scripts]
cpat-fetch = "cpat.scripts.fetch_universe:main"
cpat-backtest = "cpat.scripts.run_backtest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cpat*"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["cpat"]
omit = ["cpat/scripts/*", "tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

# ── MyPy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 99
src = ["cpat", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM", "TCH"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]
